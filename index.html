<!DOCTYPE html>
<html lang="th">
<head>

<meta name="theme-color" content="#0B1F8F">

  html, body { margin: 0; height: 100%; background: #0B1F8F; }

<body>
<iframe id="app" title="CPS Survey 2026" allow="clipboard-write"></iframe>
<script>
  // CPS Survey 2026 – Apps Script web app (data stays in the Google Sheet)

  var q = new URLSearchParams(location.search);
  q.set('base', location.origin + location.pathname);
  if (q.get('page') === 'dash') document.title = 'CPS Survey Dashboard';
  document.getElementById('app').src = EXEC + '?' + q.toString();
</script>
</body>
